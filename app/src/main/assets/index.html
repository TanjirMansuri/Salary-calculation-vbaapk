<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b35">
<title>My Salary Calculator</title>

<style>
:root{
--green:#173b35;
--gold:#c49b55;
--bg:#f4f6f3;
--card:#fff;
--muted:#64736d
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--bg);
font-family:Arial,sans-serif;
color:#1c2924
}
.top{
background:var(--green);
color:#fff;
padding:22px 18px 26px
}
.top h1{font-size:22px;margin:0 0 5px}
.top p{margin:0;color:#d8e5df;font-size:13px}
.wrap{max-width:620px;margin:auto;padding:14px}
.card{
background:var(--card);
border-radius:15px;
padding:16px;
margin:0 0 13px;
box-shadow:0 3px 14px #183b3510
}
.card h2{
font-size:16px;
margin:0 0 13px;
color:var(--green)
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px
}
.field label{
display:block;
font-size:12px;
color:var(--muted);
margin:0 0 6px
}
.field input,.field select{
width:100%;
padding:12px 10px;
border:1px solid #d9e1dc;
border-radius:9px;
font-size:16px;
background:#fff;
color:#17251f
}
.field.full{grid-column:1/-1}
.hint{
font-size:12px;
color:var(--muted);
line-height:1.5;
margin-top:9px
}
.result{
background:var(--green);
color:white;
border-radius:15px;
padding:17px;
margin-bottom:13px
}
.result .label{font-size:13px;color:#d9e5df}
.amount{font-size:30px;font-weight:700;margin:5px 0 12px}
.rows{
display:grid;
grid-template-columns:1fr auto;
gap:8px;
font-size:13px;
border-top:1px solid #ffffff30;
padding-top:11px
}
.rows div:nth-child(even){text-align:right}
.sub{color:#d9e5df}
.btn{
background:var(--gold);
color:#fff;
border:0;
border-radius:9px;
padding:12px 16px;
font-weight:700;
width:100%;
font-size:15px
}
.small{
font-size:11px;
color:var(--muted);
text-align:center;
padding:8px 4px 18px
}
@media(max-width:380px){
.grid{grid-template-columns:1fr}
.field.full{grid-column:auto}
}
</style>
</head>

<body>

<header class="top">
<h1>My Salary Calculator</h1>
<p>Personal monthly salary estimate</p>
</header>

<main class="wrap">

<section class="card">
<h2>Month & Saved Salary Structure</h2>

<div class="grid">

<div class="field">
<label for="month">Salary month</label>
<select id="month"></select>
</div>

<div class="field">
<label for="year">Year</label>
<input id="year" type="number" value="2026">
</div>

<div class="field">
<label for="basic">Basic (₹)</label>
<input id="basic" type="number" value="14209">
</div>

<div class="field">
<label for="conveyance">Conveyance (₹)</label>
<input id="conveyance" type="number" value="1338">
</div>

<div class="field">
<label for="leave">Leave encashment (₹)</label>
<input id="leave" type="number" value="547">
</div>

<div class="field">
<label for="bonus">Bonus (Pay Rate) (₹)</label>
<input id="bonus" type="number" value="1229">
</div>

<div class="field">
<label for="special">Special Allowance (₹)</label>
<input id="special" type="number" value="1000">
</div>

<div class="field">
<label>Calculated Pay Rate Total</label>
<input id="fixed" type="text" readonly>
</div>

<div class="field">
<label>Fixed monthly salary</label>
<input id="monthlyfixed" type="text" readonly>
</div>

</div>

<div class="hint">
Special Allowance ₹1,000 fixed monthly earning mein add hota hai.
Duty rate Basic + Conveyance + Leave Encashment + Bonus se calculate hota hai.
</div>
</section>

<section class="card">
<h2>Current Month Extra Duty</h2>

<div class="grid">

<div class="field">
<label for="sat">Saturday payable duty days</label>
<input id="sat" type="number" min="0" value="0">
</div>

<div class="field">
<label for="sun">Sunday payable duty days</label>
<input id="sun" type="number" min="0" value="0">
</div>

<div class="field">
<label for="holiday">Fixed Holiday duty
